<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surprise Button</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <p class="hint" id="hint">One button. Infinite surprises.</p>

    <button class="surprise-btn" id="surpriseBtn" type="button" aria-live="polite">
      Surprise me!
    </button>

    <p class="result" id="result" hidden></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
