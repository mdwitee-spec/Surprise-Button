<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  // https://www.w3schools.com/tags/att_meta_charset.asp
  <title>Surprise Button</title>
  <link rel="stylesheet" href="style.css">
  // https://www.google.com/search?q=link+rel%3D%22stylesheet%22+href%3D%22style.css&ie=UTF-8
</head>
<body>
  <main class="app">
    <p class="hint" id="hint">One button. Infinite surprises.</p>

    <button class="surprise-btn" id="surpriseBtn" type="button" aria-live="polite">
      Surprise me!
    </button>
// GOG ini adalah hal terpentingnya yaitu button surpriseBtn
    <p class="result" id="result" hidden></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
